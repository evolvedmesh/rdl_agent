name: build

# Produces a self-contained Electrobun bundle per desktop platform and attaches it to the
# release:
#   app/                 the self-extracting Electrobun wrapper (bin/launcher + a
#                         compressed Resources/<hash>.tar.zst — NOT a flat bin/bun tree;
#                         run bin/launcher once to install it, same as any end user would)
#   tools/                poppler-utils + ImageMagick FOR THAT PLATFORM, libraries vendored
#   README.md            how to run it
# packaged as rdl-agent-<platform>.tar.gz (Linux/macOS) or .zip (Windows).
#
# `tools/` sits beside the wrapper, not inside it, which means it is only found
# automatically while running straight out of this extracted folder. Once `bin/launcher`
# installs the app elsewhere (its normal, intended use), resolveTool()
# (packages/feedback/src/bin.ts) can no longer find it there — see the README's
# LAYOUT_TOOLS_DIR note. Bundling tools/ *inside* the Electrobun payload instead (so it
# travels through self-extraction) is a real option but changes electrobun.config.ts and
# packages/feedback/src/bin.ts's search order too, not just this workflow — left as a
# known follow-up rather than done silently here.
#
# Hutch does not cross-compile, so each leg runs on its native runner and builds there.
# The smoke test decompresses the wrapper's real payload (mirroring what bin/launcher
# would extract) and runs the bundled tools against a fixture PDF, so a bundle whose
# vendored libraries are incomplete never reaches a release.
#
# STATUS: the Electrobun legs of this workflow have NOT been run. The port was verified
# locally with `hutch electrobun dev` on Linux only; `--env=stable`, macOS and Windows are
# unproven here. Treat the first run as the test.
#
# Triggers:
#   - `workflow_call` with `tag`  — how release.yml invokes it after a release is cut.
#         (A direct call rather than a `release`/`push: tags` trigger, so exactly one
#         build runs per release and it is the one release.yml asked for. Do not add a
#         tag trigger: release.yml now tags as a GitHub App, whose tags DO start
#         workflows, so a tag trigger would double-build every release.)
#   - `workflow_dispatch`  — manual; give a `tag` to also upload onto that release,
#         leave it blank to just produce the artifacts.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build for and attach assets to."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for and upload onto (blank = build artifacts only)."
        required: false
        default: ""

concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

# ImageMagick's portable AppImage, pinned. `imagemagick.org/archive/binaries/magick`
# was a floating "latest" URL and started 404ing (it moved to download.imagemagick.org);
# a release pipeline should not depend on a binary that can move or change under it, so
# this points at a versioned GitHub release asset instead. Bump this one line to update.
env:
  IMAGEMAGICK_VERSION: "7.1.2-31"

jobs:
  # One fast gate before the matrix compiles three binaries.
  verify:
    runs-on: ubuntu-latest
    # Harmless for a normal binary; lets the portable ImageMagick run without FUSE.
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          if ! magick -version >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends imagemagick || true
          fi
          if ! magick -version >/dev/null 2>&1; then
            # Ubuntu's apt ships ImageMagick 6, which has no `magick` command; the
            # feedback code needs 7. Fall back to ImageMagick's official portable build.
            curl -fsSL "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage" -o /tmp/magick
            chmod +x /tmp/magick
            sudo mv /tmp/magick /usr/local/bin/magick
          fi
          magick -version >/dev/null
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-latest
            archive: tar
          - id: macos-arm64
            os: macos-14
            archive: tar
          - id: windows-x64
            os: windows-2022
            archive: zip

    runs-on: ${{ matrix.os }}
    # Only meaningful on Linux (the bundled ImageMagick is an AppImage there); ignored
    # elsewhere.
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Electrobun's Linux wrapper links GTK 3, WebKitGTK 4.1, Ayatana AppIndicator and
      # librsvg. Without them the build succeeds and the launcher then refuses to start.
      - name: Linux webview runtime
        if: matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake pkg-config

      - name: Install Hutch (Linux/macOS)
        if: matrix.id != 'windows-x64'
        shell: bash
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      # The Linux/macOS installer is a POSIX shell script; Hutch's own docs give a
      # separate PowerShell command for Windows rather than saying the .sh works there,
      # so this does not reuse it. The install path below mirrors the documented
      # ~/.hutch/bin convention but is UNVERIFIED — the "Verify Hutch" step next fails
      # fast and clearly if it's wrong, rather than "hutch: command not found" ten steps
      # into the build.
      - name: Install Hutch (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.hutch\bin"

      - name: Verify Hutch is on PATH
        shell: bash
        run: hutch --version

      # Vite owns the view build (Hutch cannot serialise the Tailwind plugin), then
      # `hutch electrobun build` packages the main process and copies the dist in.
      - name: Build the app bundle
        run: |
          bun run ui
          hutch electrobun build --env=stable

      # --- vendor poppler + ImageMagick into the bundle's tools/ --------------------
      # resolveTool() (packages/feedback/src/bin.ts) looks for these in a `tools/` beside
      # the running binary, so an offline drop works. NOT `bin/` — that is Electrobun's
      # own (launcher, bundled bun, bspatch, zig-zstd). Libraries are vendored too; the
      # one system dependency left is each platform's C runtime, plus GTK/WebKit on Linux.

      - name: Stage the app bundle
        shell: bash
        run: |
          set -euo pipefail
          out="rdl-agent-${{ matrix.id }}"
          mkdir -p "$out/tools"

          # Located structurally, not by name: Hutch names the per-platform build
          # folder with its OWN os token ("win", not "windows"), and the app bundle
          # inside it drops the space from "Layout Agent" (verified: `LayoutAgent/`,
          # not `Layout Agent/`) — a name glob for either one broke the first time this
          # ran. Every stable build is exactly one directory under build/stable-*/,
          # whatever that directory is called.
          stable_dir="$(find build -mindepth 1 -maxdepth 1 -type d -name 'stable-*' | head -1)"
          if [ -z "$stable_dir" ]; then
            echo "no stable-* build output under build/"; find build -maxdepth 2; exit 1
          fi
          app="$(find "$stable_dir" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$app" ]; then
            echo "no app bundle inside $stable_dir"; find "$stable_dir" -maxdepth 2; exit 1
          fi
          cp -R "$app" "$out/app"

      - name: Bundle tools (Linux)
        if: matrix.id == 'linux-x64'
        run: |
          set -euo pipefail
          out="rdl-agent-${{ matrix.id }}"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils patchelf

          # poppler: copy the three tools and every shared lib they pull in, except the
          # ABI floor (libc + the dynamic loader), then point each at its own dir.
          for t in pdfinfo pdftotext pdftoppm; do
            cp "$(command -v "$t")" "$out/tools/$t"
          done
          ( cd "$out/tools"
            for t in pdfinfo pdftotext pdftoppm; do
              ldd "$t" | awk '/=> \//{print $3}' | while read -r lib; do
                case "$(basename "$lib")" in
                  libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*) ;;
                  *) cp -n "$lib" . 2>/dev/null || true ;;
                esac
              done
              patchelf --set-rpath '$ORIGIN' "$t"
            done )

          # ImageMagick: its official portable build is already a single self-contained
          # file, so no vendoring — just drop it in. (An AppImage; APPIMAGE_EXTRACT_AND_RUN
          # is set job-wide so it runs without FUSE.)
          curl -fsSL "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage" -o "$out/tools/magick"
          chmod +x "$out/tools/magick"

      - name: Bundle tools (macOS)
        if: matrix.id == 'macos-arm64'
        # Builds ImageMagick from source (below), and dylibbundler blocks on an
        # interactive prompt when a lookup fails, so bound the step on both counts.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="rdl-agent-${{ matrix.id }}"

          brew install poppler dylibbundler libpng

          # ImageMagick is built here rather than taken from Homebrew, whose formula
          # configures it --with-modules. The coders are then dlopen'd .so files, and
          # dylibbundler only rewrites *linked* dylibs — so a bundled copy of Homebrew's
          # build ships with no coders at all and fails with "no decode delegate for
          # this image format" on every PNG. --without-modules links the coders into the
          # binary: that is what makes the bundle self-contained, and it gives
          # dylibbundler the same shape it already handles for poppler.
          #
          # Only PNG and zlib are enabled. The feedback code reads and writes nothing
          # else (identify + -crop on PNGs; see packages/feedback/src/pdf.ts). The
          # deny-list is explicit rather than relying on defaults because configure
          # auto-detects whatever happens to be installed on the runner and links it in,
          # which would make the bundle's contents vary by runner image. Dropping
          # Magick++ and the delegates also takes the build down to well under a minute.
          # Same pinned version as the Linux AppImage and the Windows portable build.
          src="$RUNNER_TEMP/im-src"; im="$RUNNER_TEMP/im"
          mkdir -p "$src"
          curl -fsSL "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}.tar.xz" \
            | tar -xJ -C "$src" --strip-components=1
          ( cd "$src"
            ./configure --prefix="$im" \
              --disable-shared --without-modules --disable-docs \
              --without-x --without-perl --without-magick-plus-plus \
              --with-png --with-zlib \
              --without-bzlib --without-djvu --without-dmr --without-fontconfig \
              --without-freetype --without-heic --without-jbig --without-jpeg \
              --without-jxl --without-lcms --without-lqr --without-lzma \
              --without-openexr --without-openjp2 --without-pango --without-raqm \
              --without-raw --without-tiff --without-webp --without-xml \
              --without-zip --without-zstd
            make -j"$(sysctl -n hw.ncpu)"
            make install )

          for t in pdfinfo pdftotext pdftoppm; do
            cp "$(brew --prefix)/bin/$t" "$out/tools/$t"
          done
          cp "$im/bin/magick" "$out/tools/magick"

          # Rewrite each tool's dylib references to @executable_path/libs, copy them there.
          #
          # -s is not optional: these binaries reference their siblings through @rpath
          # (e.g. @rpath/libpoppler.163.dylib), which dylibbundler cannot resolve on its
          # own. On a miss it does not fail — it PROMPTS on stdin for the path, so in CI
          # the step hangs until the job is killed rather than reporting an error.
          # Pointing it at Homebrew's lib dir is what keeps this non-interactive.
          ( cd "$out/tools"
            for t in pdfinfo pdftotext pdftoppm magick; do
              dylibbundler -of -cd -b -x "./$t" -d ./libs -p '@executable_path/libs' \
                -s "$(brew --prefix)/lib"
            done )

      - name: Bundle tools (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "rdl-agent-${{ matrix.id }}"
          New-Item -ItemType Directory -Force -Path "$out/tools" | Out-Null

          choco install --no-progress -y poppler

          # poppler's Windows build keeps its DLLs beside the .exe. Copy from the real
          # install dir under chocolatey\lib, not the shim in chocolatey\bin.
          function ToolDir($lib, $exe) {
            $hit = Get-ChildItem "C:\ProgramData\chocolatey\lib\$lib" -Recurse -Filter $exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { throw "$exe not found under chocolatey\lib\$lib" }
            return $hit.DirectoryName
          }
          Copy-Item (Join-Path (ToolDir 'poppler' 'pdftoppm.exe') '*') "$out/tools/" -Recurse -Force

          # ImageMagick comes from the same pinned release as the Linux leg, not from
          # Chocolatey: `imagemagick.portable` no longer exists on the community feed.
          # The portable build's magick.exe is fully self-contained (every tool in the
          # archive is the same 31MB static binary), so only it and the configuration
          # XML ship — `magick identify` covers what the feedback code needs.
          $ver    = $env:IMAGEMAGICK_VERSION
          $sevenZ = Join-Path $env:RUNNER_TEMP 'imagemagick.7z'
          $imDir  = Join-Path $env:RUNNER_TEMP 'imagemagick'
          curl.exe -fsSL "https://github.com/ImageMagick/ImageMagick/releases/download/$ver/ImageMagick-$ver-portable-Q16-HDRI-x64.7z" -o $sevenZ
          if ($LASTEXITCODE) { throw "ImageMagick download failed ($LASTEXITCODE)" }
          $sz = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sz)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "7-Zip not found" }
            $sz = $cmd.Source
          }
          & $sz x $sevenZ "-o$imDir" -y | Out-Null
          if ($LASTEXITCODE) { throw "ImageMagick extract failed ($LASTEXITCODE)" }
          Copy-Item "$imDir\magick.exe" "$out/tools/"
          Copy-Item "$imDir\*.xml" "$out/tools/"
          Copy-Item "$imDir\*.icc" "$out/tools/"
          foreach ($e in 'pdfinfo.exe','pdftotext.exe','pdftoppm.exe','magick.exe') {
            if (-not (Test-Path "$out/tools/$e")) { throw "missing $e in bundle" }
          }

      - name: Bundle README
        shell: bash
        run: |
          out="rdl-agent-${{ matrix.id }}"
          # macOS wraps the launcher in a native .app bundle (Contents/MacOS/,
          # Contents/Resources/); Linux and Windows ship it as a flat bin/ + Resources/
          # tree. The installed copy the launcher unpacks has the same platform shape.
          launcher="app/bin/launcher"
          bindir="bin"
          resdir="Resources"
          if [ "${{ matrix.id }}" = "macos-arm64" ]; then
            launcher="app/Contents/MacOS/launcher"
            bindir="Contents/MacOS"
            resdir="Contents/Resources"
          fi
          cat > "$out/README.md" <<EOF
          # RDL Agent

          \`app/\` is the Electrobun bundle. Launch the desktop app with:

              ./$launcher

          The same bundle is also the headless core and the per-session MCP proxy —
          but the app itself invokes these automatically (an agent session spawns the
          shim; there is no reason to run \`serve\` by hand unless you are driving the
          app from a browser instead of the window). If you do need to, run the
          launcher once first — it only installs the runtime, it does not contain it —
          then use the path it prints for the installed copy:

              ./$launcher                                              # installs, then opens the window
              <installed-dir>/$bindir/bun <installed-dir>/$resdir/app/bun/index.js serve
              <installed-dir>/$bindir/bun <installed-dir>/$resdir/app/bun/index.js mcp-shim --stdio --session <id>

          \`tools/\` holds poppler-utils + ImageMagick with their libraries vendored. It
          is only found automatically while running directly out of this extracted
          folder — once the launcher installs the app elsewhere, point it at these
          tools explicitly:

              export LAYOUT_TOOLS_DIR="\$(pwd)/tools"     # keep this folder; don't delete it after installing

          or simply install poppler-utils + ImageMagick 7 (the \`magick\` command, not
          ImageMagick 6) system-wide instead. On Linux \`tools/magick\` is ImageMagick's
          portable AppImage — if your box has no FUSE, export
          \`APPIMAGE_EXTRACT_AND_RUN=1\` before launching.

          On Linux the app itself additionally needs gtk3, webkit2gtk-4.1,
          libayatana-appindicator and librsvg from your distribution; the launcher names
          the missing library if one is absent.

          Agent sessions still need an ACP agent CLI (Claude Code, opencode, …) on your
          PATH; it reuses your existing login.
          EOF

      # --- smoke test: the bundle boots, and its vendored poppler + ImageMagick run
      #     standalone (relative-path invocation from inside tools/, so a broken rpath /
      #     dylib / DLL fails HERE and the bundle never reaches a release) ------------
      #
      # A stable build is a self-extracting WRAPPER — `app/bin/` holds only `launcher`;
      # the real runtime is compressed in `app/Resources/<hash>.tar.zst`. Decompressing
      # it directly is what a real install would produce, without running the GUI
      # installer (which writes into the runner's home directory and tries to open a
      # window this runner does not have).
      - name: Smoke test (Linux/macOS)
        if: matrix.id != 'windows-x64'
        run: |
          set -euo pipefail
          out="rdl-agent-${{ matrix.id }}"

          # macOS wraps the same self-extracting payload in a native .app bundle
          # instead of the flat bin/ + Resources/ tree Linux and Windows use — and this
          # is true of BOTH the outer wrapper and the runtime that self-extracts out of
          # it: on macOS the payload unpacks to `<name>.app/Contents/{MacOS,Resources}/`,
          # elsewhere to `<name>/{bin,Resources}/`. So the bun binary and the main-process
          # entry both sit one layout deeper on macOS.
          resources="$out/app/Resources"
          bindir="bin"
          resdir="Resources"
          if [ "${{ matrix.id }}" = "macos-arm64" ]; then
            resources="$out/app/Contents/Resources"
            bindir="Contents/MacOS"
            resdir="Contents/Resources"
          fi

          payload="$(find "$resources" -maxdepth 1 -name '*.tar.zst' | head -1)"
          [ -n "$payload" ] || { echo "no compressed payload in $resources"; ls -la "$resources"; exit 1; }
          extracted="$(mktemp -d)"
          tar --zstd -xf "$payload" -C "$extracted"
          runtime="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d | head -1)"
          [ -n "$runtime" ] || { echo "payload extracted nothing"; find "$extracted"; exit 1; }

          # `serve` refuses to start without somewhere to keep the client secret, and a
          # CI runner has no keychain (no secret-tool on Linux; no Windows backend at
          # all — see defaultSecretStore in packages/core/src/credentials.ts). This is
          # that documented opt-in: the data dir is a throwaway temp dir and the smoke
          # test never stores a credential, so no secret is ever written.
          #
          # Invoking the bundled runtime directly is also the real test of the shim
          # path: it is exactly what Session.mcpServerConfig() spawns.
          bun_bin="$runtime/$bindir/bun"
          app_entry="$runtime/$resdir/app/bun/index.js"
          [ -x "$bun_bin" ] || { echo "no bun binary at $bun_bin"; find "$runtime" -maxdepth 3; exit 1; }
          LAYOUT_DATA_DIR="$(mktemp -d)" LAYOUT_ALLOW_PLAINTEXT_SECRET=1 LAYOUT_NO_AUTH=1 \
            "$bun_bin" "$app_entry" serve > serve.log 2>&1 &
          pid=$!
          port=""
          for _ in $(seq 1 30); do
            port=$(grep -oE '127\.0\.0\.1:[0-9]+' serve.log | head -1 | cut -d: -f2 || true)
            [ -n "$port" ] && break
            sleep 1
          done
          [ -n "$port" ] || { echo "no port reported"; cat serve.log; exit 1; }
          curl -fsS "http://127.0.0.1:$port/api/state" > /dev/null
          kill "$pid" 2>/dev/null || true
          echo "app booted on :$port"

          b="$out/tools"; pdf="test/fixtures/preview.pdf"; work="$(mktemp -d)"
          "$b/pdfinfo" "$pdf" | grep -q '^Pages:'
          test -n "$("$b/pdftotext" -layout "$pdf" -)"
          "$b/pdftoppm" -png -r 72 -singlefile "$pdf" "$work/p"
          test -s "$work/p.png"
          "$b/magick" identify -format '%wx%h' "$work/p.png" | grep -Eq '^[0-9]+x[0-9]+$'
          echo "bundled poppler + ImageMagick run standalone"

      - name: Smoke test (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "rdl-agent-windows-x64"

          # Same reasoning as the Linux/macOS leg: a stable build is a self-extracting
          # wrapper, not a flat bin\bun.exe tree, so decompress its real payload rather
          # than running the installer (which installs into the runner's profile and
          # tries to open a window this runner does not have).
          $payload = Get-ChildItem "$out\app\Resources" -Filter '*.tar.zst' | Select-Object -First 1
          if (-not $payload) { throw "no compressed payload in $out\app\Resources" }
          $extracted = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))
          tar --zstd -xf $payload.FullName -C $extracted.FullName
          if ($LASTEXITCODE) { throw "extracting $($payload.Name) failed" }
          $runtime = Get-ChildItem $extracted.FullName -Directory | Select-Object -First 1
          if (-not $runtime) { throw "payload extracted nothing" }

          $env:LAYOUT_DATA_DIR = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))).FullName
          # Windows has no keychain backend at all, so this is required, not just
          # convenient. See the Linux/macOS smoke test for why it is safe here.
          $env:LAYOUT_ALLOW_PLAINTEXT_SECRET = "1"
          $env:LAYOUT_NO_AUTH = "1"
          # The bundled runtime against the bundled main process — exactly what
          # Session.mcpServerConfig() spawns, so this exercises the shim path too.
          $p = Start-Process -FilePath (Join-Path $runtime.FullName 'bin\bun.exe') `
                 -ArgumentList (Join-Path $runtime.FullName 'Resources\app\bun\index.js'), "serve" `
                 -RedirectStandardOutput serve.log -RedirectStandardError serve.err -PassThru
          $port = $null
          foreach ($_ in 1..30) {
            if (Test-Path serve.log) {
              $m = Select-String -Path serve.log -Pattern '127\.0\.0\.1:(\d+)' | Select-Object -First 1
              if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
            }
            Start-Sleep 1
          }
          if (-not $port) { Get-Content serve.log, serve.err -ErrorAction SilentlyContinue; throw "no port reported" }
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/api/state" | Out-Null
          Stop-Process -Id $p.Id -Force
          Write-Host "app booted on :$port"

          $b = "$out\tools"; $pdf = "test\fixtures\preview.pdf"
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))
          # `$info` is pdfinfo's ~20 output lines. Against an array, PowerShell's
          # -match/-notmatch FILTER rather than return a boolean: `$info -notmatch
          # 'Pages:'` yields the 19 lines that don't match, and a non-empty array is
          # truthy — so the old check threw even when pdfinfo worked. `-not ($info
          # -match ...)` is the array-safe form (empty result = no match = throw).
          $info = & "$b\pdfinfo.exe" $pdf
          if ($LASTEXITCODE -or -not ($info -match '^Pages:')) {
            throw "pdfinfo.exe failed (exit $LASTEXITCODE): $($info -join ' / ')"
          }
          & "$b\pdftotext.exe" -layout $pdf - | Out-Null
          if ($LASTEXITCODE) { throw "pdftotext.exe failed" }
          & "$b\pdftoppm.exe" -png -r 72 -singlefile $pdf (Join-Path $work "p")
          if ($LASTEXITCODE -or -not (Test-Path (Join-Path $work "p.png"))) { throw "pdftoppm.exe failed" }
          $dim = & "$b\magick.exe" identify -format '%wx%h' (Join-Path $work "p.png")
          if ($LASTEXITCODE -or ($dim -notmatch '^\d+x\d+$')) { throw "magick.exe identify failed: $dim" }
          Write-Host "bundled poppler + ImageMagick run standalone"

      # --- archive + upload ------------------------------------------------------
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -czf "rdl-agent-${{ matrix.id }}.tar.gz" "rdl-agent-${{ matrix.id }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "rdl-agent-${{ matrix.id }}" -DestinationPath "rdl-agent-${{ matrix.id }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rdl-agent-${{ matrix.id }}
          path: |
            rdl-agent-${{ matrix.id }}.tar.gz
            rdl-agent-${{ matrix.id }}.zip
          if-no-files-found: error

  # Attach the three bundles to the GitHub Release semantic-release (release.yml)
  # already created for this tag. It owns the notes; we only add assets. Skipped for a
  # bare `workflow_dispatch` with no tag (build-artifacts-only).
  release:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          # `-dev.N` tags are prereleases; matches what semantic-release already set.
          prerelease: ${{ contains(inputs.tag, '-') }}
